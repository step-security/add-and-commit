name: Test
on:
  push:
  pull_request:
    branches:
      [main]
  workflow_dispatch:

permissions: {}

jobs:
  build:
    permissions:
      contents: read  # for actions/checkout to fetch code
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@5ef0c079ce82195b2a36a210272d6b661572d83e # v2.14.2
        with:
          egress-policy: audit

      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify dist/ matches source
        id: verify-dist
        run: |
          if [ "$(git diff --ignore-space-at-eol --text -- dist/ | wc -l)" -gt "0" ] \
            || [ -n "$(git ls-files --others --exclude-standard -- dist/)" ]; then
            echo "Committed dist/ is out of sync with src/. Run npm ci && npm run build and commit dist/."
            git diff --ignore-space-at-eol --text -- dist/
            git ls-files --others --exclude-standard -- dist/
            exit 1
          fi

  test:
    permissions:
      contents: read  # for actions/checkout to fetch code
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@5ef0c079ce82195b2a36a210272d6b661572d83e # v2.14.2
        with:
          egress-policy: audit

      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test

  lint:
    permissions:
      contents: read  # for actions/checkout to fetch code
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@5ef0c079ce82195b2a36a210272d6b661572d83e # v2.14.2
        with:
          egress-policy: audit

      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
